
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .login-box {
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            background-color: white;
            text-align: center;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 25px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <input type="text" id="username" placeholder="Username">

        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="message"></p>

    </div>


    <script>

       function login() {

    let usernameBox = document.getElementById("username");
    let passwordBox = document.getElementById("password");
    let message = document.getElementById("message");

    let enteredUsername = usernameBox.value;
    let enteredPassword = passwordBox.value;

    fetch("users.xml")
        .then(response => response.text())
        .then(data => {

            let parser = new DOMParser();

            let xml = parser.parseFromString(data, "text/xml");

            let users = xml.getElementsByTagName("user");

            let loginSuccessful = false;

            for (let i = 0; i < users.length; i++) {

                let username = users[i].getElementsByTagName("username")[0].textContent;
                let password = users[i].getElementsByTagName("password")[0].textContent;

                if (enteredUsername == username && enteredPassword == password) {

                    loginSuccessful = true;
                    break;

                }
            }

            if (loginSuccessful) {

                message.innerHTML = "Login Successful!";
                message.style.color = "green";
                
                window.location.href = "StudentPortal.html"; // Redirect to welcome page

                

            } else {

                message.innerHTML = "Incorrect Credentials!";
                message.style.color = "red";

            }

        });


}

    </script>

</body>
</html>
